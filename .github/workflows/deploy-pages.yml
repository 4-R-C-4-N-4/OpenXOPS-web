name: Deploy browser preview

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'tools/**'
      - 'assets/**'
      - 'tests/**'
      - 'LICENSE'
      - 'NOTICE.md'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt
      - name: Install test dependencies
        run: python -m pip install -r tools/requirements-ci.txt
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: '6.0.12'
          actions-cache-folder: emsdk-cache
      - name: Test archive validation and packaging
        run: python3 -m unittest discover -s tools/tests -v
      - name: Build browser preview and free data pack
        run: bash tools/build-playable-web.sh
      - name: Stage allowlisted files and reject proprietary data
        run: python3 tools/stage_pages.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build-pages
  deploy:
    # Branch workflow_dispatch can validate a fix without replacing the live game.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
