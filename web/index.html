<!doctype html><html lang="en"><meta charset="utf-8"><title>OpenXOPS browser preview</title><style>body{margin:0;background:#151719;color:#ddd;font:16px monospace;text-align:center}canvas{display:block;margin:auto;width:min(100vw,960px);height:auto;image-rendering:auto}button,input{margin:12px;padding:10px}pre{max-height:160px;overflow:auto;text-align:left;font-size:11px}a{color:#9cf}</style><h2>OpenXOPS — browser preview</h2><p>Unofficial BSD engine port. Select your own original xops096.zip; it stays in this browser.</p><input id="archive" type="file" accept=".zip"><button id="play" disabled>Loading engine…</button><p id="status">Preparing WASM…</p><canvas id="canvas" width="640" height="480" tabindex="0" oncontextmenu="event.preventDefault()"></canvas><p>Click canvas to capture mouse. Esc releases it. Original key bindings apply. <a href="LICENSE">Engine license</a></p><pre id="log"></pre><script>
const logElement=document.getElementById('log'),play=document.getElementById('play'),status=document.getElementById('status'),canvas=document.getElementById('canvas');
var Module={canvas,noInitialRun:true,print:s=>{logElement.textContent+=s+'\n';console.log(s)},printErr:s=>{logElement.textContent+=s+'\n';console.error(s)},onRuntimeInitialized(){play.disabled=false;play.textContent='Start game';status.textContent='Select your original archive, then Start game.'}};
play.onclick=async()=>{const file=document.getElementById('archive').files[0];if(!file){status.textContent='Select xops096.zip first.';return;}play.disabled=true;try{const bytes=new Uint8Array(await file.arrayBuffer());Module.FS.writeFile('/xops096.zip',bytes);Module.FS.mkdirTree('/save');Module.FS.chdir('/');status.textContent='Starting original game…';canvas.focus();Module.callMain(['-Dir','/']);status.textContent='Game running. Click canvas for mouse control.';}catch(e){status.textContent='Startup failed: '+e;console.error(e);play.disabled=false;}};
canvas.onclick=()=>{canvas.focus();canvas.requestPointerLock?.();if(typeof SDL2!=='undefined'&&SDL2.audioContext)SDL2.audioContext.resume();};
</script><script src="openxops.js"></script></html>
